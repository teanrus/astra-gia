name: Generate release checksums

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag whose .deb assets should receive a SHA256SUMS file
        required: true
        default: v2.0

permissions:
  contents: write

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Download release packages and generate checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          assets_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir "$assets_dir"
          if ! compgen -G "$assets_dir/*.deb" > /dev/null; then
            echo "No .deb release assets found for $RELEASE_TAG" >&2
            exit 1
          fi
          (
            cd "$assets_dir"
            sha256sum -- *.deb > SHA256SUMS
          )
          gh release upload "$RELEASE_TAG" "$assets_dir/SHA256SUMS" --repo "$GITHUB_REPOSITORY" --clobber
